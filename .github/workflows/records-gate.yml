# records-gate.yml -- the I1 audit gate for skillify-core (the private repo).
#
# Canonical spec: /tmp/split-pipeline-design.md Section 2 (repo-db), plus the
# ratified owner decisions:
#   - ntfy on CI failure: YES. The failure notification posts to the homelab
#     ntfy instance via one NTFY_URL secret and is folded into the daily
#     08:00 digest + --urgent path (consistent with the notification model).
#   - work-identifiers.json: DROPPED (owner decision #4). No real-name
#     blocklist is ever committed to ANY repo. Enforcement = the structural
#     leak classes (ticket-id, internal-domain, verbatim speech) + the
#     genericization vocabulary at capture time.
#
# Activation note: teaching/recordify/audit-records.mjs has landed (recordify
# completion); records/ lands with the corpus import. The gate is live
# once main is pushed with those files present.
#
# CI gates beyond the audit itself: `bun install --frozen-lockfile` makes
# the Makefile check-ts (tsc --noEmit) a HARD gate instead of WARN-skipping,
# and the shellcheck apt install makes check-bash's shellcheck half run for
# real (host pattern is graceful WARN+skip; CI installs the tools -- same
# pattern as TrueHL's check.yml).
#
# Solo-owner direct-push workflow: CI cannot block a push landing on main --
# it is detect + notify + mark. The homeserver re-audit (the same
# audit-records.mjs, run on the pull) is the actual ingest gate; a leak can
# never be ingested even if CI was bypassed or red.
name: records-gate
on:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install deps (typescript gate)
        run: bun install --frozen-lockfile

      - name: Install linters (shellcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Sanitizer contract (I1 test suite)
        run: bun test teaching/recordify/sanitize.test.mjs

      - name: Full-corpus audit (structure + speech + structural identifiers)
        run: bun teaching/recordify/audit-records.mjs records/

      - name: make check (bash -n + shellcheck, node --check, tsc --noEmit, security scan)
        run: make check

      - name: Notify ntfy on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          : "${NTFY_URL:?NTFY_URL secret not set on the repo}"
          curl -sS -o /dev/null "$NTFY_URL" \
            -H "Title: records-gate FAILED (skillify-core ${GITHUB_SHA:0:8})" \
            -H "Priority: urgent" \
            -H "Tags: warning,git" \
            --data-binary "records-gate failed for commit ${GITHUB_SHA} in ${GITHUB_REPOSITORY}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
